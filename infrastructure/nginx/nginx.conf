events {}

http {
    server_tokens off;
    client_max_body_size 10m;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    upstream auth_service { server auth-service:8000; }
    upstream school_service { server school-service:8000; }
    upstream analytics_service { server analytics-service:8000; }
    upstream notification_service { server notification-service:8000; }

    server {
        listen 80;

        location = /health/live {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location = /internal/auth/verify {
            internal;
            proxy_pass http://auth_service/v1/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/v1/auth/ {
            limit_req zone=api_limit burst=40 nodelay;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://auth_service;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/classes/[0-9a-fA-F-]+/analytics(?:/|$) {
            auth_request /internal/auth/verify;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $telegram_id $upstream_http_x_telegram_id;
            auth_request_set $global_role $upstream_http_x_global_role;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://analytics_service;
            proxy_set_header X-User-ID $user_id;
            proxy_set_header X-Telegram-ID $telegram_id;
            proxy_set_header X-Global-Role $global_role;
            proxy_set_header X-Correlation-ID $request_id;
        }

        location /api/v1/classes {
            auth_request /internal/auth/verify;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $telegram_id $upstream_http_x_telegram_id;
            auth_request_set $global_role $upstream_http_x_global_role;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://school_service;
            proxy_set_header X-User-ID $user_id;
            proxy_set_header X-Telegram-ID $telegram_id;
            proxy_set_header X-Global-Role $global_role;
            proxy_set_header X-Correlation-ID $request_id;
        }

        location /api/v1/notifications {
            auth_request /internal/auth/verify;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $telegram_id $upstream_http_x_telegram_id;
            auth_request_set $global_role $upstream_http_x_global_role;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://notification_service;
            proxy_set_header X-User-ID $user_id;
            proxy_set_header X-Telegram-ID $telegram_id;
            proxy_set_header X-Global-Role $global_role;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8080;

        location = /stub_status {
            access_log off;
            stub_status;
        }

        location / {
            return 404;
        }
    }
}
